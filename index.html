<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyric Sync</title>
<style>
  :root { --bg:#12121a; --panel:#1c1c28; --text:#f2f2f7; --dim:#7d7d90; --accent:#8b7bff; --ok:#4ade80; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  .tab { background:transparent; color:var(--dim); border:1px solid #333; padding:8px 14px; border-radius:20px; font-size:14px; cursor:pointer; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:800px; margin:0 auto; padding:16px; }
  .card { background:var(--panel); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
  input[type=file] { width:100%; color:var(--text); }
  textarea { width:100%; height:120px; background:#0e0e14; color:var(--text); border:1px solid #333; border-radius:8px; padding:10px; font-size:14px; }
  button { font-size:15px; padding:10px 14px; border-radius:10px; border:none; background:#2b2b3d; color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; }
  button:active { transform:scale(.97); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  audio { width:100%; margin-top:8px; }
  #tap { width:100%; font-size:26px; padding:28px 10px; margin:10px 0; background:var(--accent); color:#fff; font-weight:700; }
  #lines { max-height:45vh; overflow-y:auto; }
  .line { padding:8px 10px; border-radius:8px; display:flex; gap:10px; cursor:pointer; font-size:15px; }
  .line .t { color:var(--dim); font-variant-numeric:tabular-nums; min-width:70px; }
  .line.next { background:#2a2550; outline:1px solid var(--accent); }
  .line.done .t { color:var(--ok); }
  .hidden { display:none; }
  #karaoke { height:60vh; overflow-y:auto; text-align:center; padding:30vh 10px; scroll-behavior:smooth; }
  #karaoke .k { font-size:26px; color:#555; padding:10px 0; transition:all .25s; cursor:pointer; }
  #karaoke .k.active { color:#fff; font-size:34px; font-weight:700; }
  #karaoke .k.past { color:#888; }
  small { color:var(--dim); }
  select, input[type=number] { background:#0e0e14; color:var(--text); border:1px solid #333; border-radius:8px; padding:8px; }
</style>
</head>
<body>
<header>
  <h1>🎤 Lyric Sync</h1>
  <button class="tab active" data-tab="sync">Sync</button>
  <button class="tab" data-tab="play">Play</button>
</header>

<main>
  <!-- Shared audio -->
  <div class="card">
    <label>1. Choose your MP3</label>
    <input type="file" id="mp3" accept="audio/*">
    <audio id="audio" controls></audio>
  </div>

  <!-- SYNC TAB -->
  <section id="sync">
    <div class="card">
      <label>2. Lyrics: load a .txt file or paste below (one line per lyric line)</label>
      <input type="file" id="txt" accept=".txt,text/plain">
      <textarea id="paste" placeholder="Paste lyrics here..."></textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="useLyrics">Use these lyrics</button>
        <label style="margin:0">or load a saved sync: <input type="file" id="lrcIn" accept=".lrc,.txt"></label>
      </div>
    </div>

    <div class="card">
      <label>3. Play the song and tap right as each line starts (or press Space)</label>
      <button id="tap">TAP</button>
      <div class="row">
        <button id="undo">↩ Undo last</button>
        <button id="back5">⏪ 5s</button>
        <button id="play">⏯ Play/Pause</button>
        <select id="speed" title="Playback speed">
          <option value="1">1x</option><option value="0.75">0.75x</option><option value="0.5">0.5x</option>
        </select>
      </div>
      <div class="row" style="margin-top:10px">
        <label style="margin:0">Reaction offset (ms)</label>
        <input type="number" id="offset" value="200" step="50" style="width:90px">
        <small>Taps are stamped this much earlier to make up for reaction time.</small>
      </div>
    </div>

    <div class="card">
      <div id="lines"><small>No lyrics loaded yet.</small></div>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="save">💾 Save synced file (.lrc)</button>
        <small id="status"></small>
      </div>
    </div>
  </section>

  <!-- PLAY TAB -->
  <section id="play-view" class="hidden">
    <div class="card"><div id="karaoke"><small>Load a song and synced lyrics first.</small></div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
let lines = [];   // {text, time|null}
let idx = 0;      // next line to stamp

/* ---------- helpers ---------- */
const fmt = t => {
  if (t == null) return '--:--.--';
  const m = Math.floor(t / 60), s = (t % 60).toFixed(2).padStart(5, '0');
  return String(m).padStart(2, '0') + ':' + s;
};
const setStatus = msg => { $('status').textContent = msg; };

/* ---------- loading files ---------- */
$('mp3').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); setStatus('Loaded: ' + f.name); }
});

$('txt').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) $('paste').value = await f.text();
});

$('useLyrics').addEventListener('click', () => {
  const text = $('paste').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!text.length) return setStatus('Add some lyrics first.');
  lines = text.map(t => ({ text: t, time: null }));
  idx = 0;
  render();
  setStatus(lines.length + ' lines ready.');
});

$('lrcIn').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  const out = [];
  for (const raw of (await f.text()).split(/\r?\n/)) {
    const m = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    if (m && m[3].trim()) out.push({ text: m[3].trim(), time: parseInt(m[1]) * 60 + parseFloat(m[2]) });
  }
  if (!out.length) return setStatus('No timestamps found in that file.');
  lines = out;
  idx = lines.length;
  $('paste').value = lines.map(l => l.text).join('\n');
  render();
  setStatus('Loaded ' + lines.length + ' synced lines.');
});

/* ---------- tapping ---------- */
function tap() {
  if (!lines.length) return setStatus('Load lyrics first.');
  if (idx >= lines.length) return setStatus('All lines stamped. Save your file!');
  const off = (parseFloat($('offset').value) || 0) / 1000;
  lines[idx].time = Math.max(0, audio.currentTime - off);
  idx++;
  render();
}
function undo() {
  if (idx <= 0) return;
  idx--;
  lines[idx].time = null;
  audio.currentTime = Math.max(0, (idx > 0 ? lines[idx - 1].time : 0));
  render();
}
$('tap').addEventListener('click', tap);
$('undo').addEventListener('click', undo);
$('back5').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 5); });
$('play').addEventListener('click', () => { audio.paused ? audio.play() : audio.pause(); });
$('speed').addEventListener('change', e => { audio.playbackRate = parseFloat(e.target.value); });

document.addEventListener('keydown', e => {
  const typing = ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement.tagName);
  if (e.code === 'Space' && !typing && !$('sync').classList.contains('hidden')) {
    e.preventDefault(); tap();
  }
});

/* ---------- rendering the line list ---------- */
function render() {
  const box = $('lines');
  if (!lines.length) { box.innerHTML = '<small>No lyrics loaded yet.</small>'; return; }
  box.innerHTML = '';
  lines.forEach((l, i) => {
    const d = document.createElement('div');
    d.className = 'line' + (i === idx ? ' next' : '') + (l.time != null ? ' done' : '');
    d.innerHTML = '<span class="t">' + fmt(l.time) + '</span><span></span>';
    d.lastChild.textContent = l.text;
    d.addEventListener('click', () => { if (l.time != null) audio.currentTime = l.time; else idx = i, render(); });
    box.appendChild(d);
  });
  const next = box.querySelector('.next');
  if (next) next.scrollIntoView({ block: 'nearest' });
  renderKaraoke();
}

/* ---------- saving ---------- */
$('save').addEventListener('click', () => {
  const stamped = lines.filter(l => l.time != null);
  if (!stamped.length) return setStatus('Nothing stamped yet.');
  const body = stamped.map(l => '[' + fmt(l.time) + '] ' + l.text).join('\n');
  const blob = new Blob([body], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lyrics.lrc';
  a.click();
  setStatus('Saved ' + stamped.length + ' lines.');
});

/* ---------- play (karaoke) view ---------- */
let activeIdx = -1;
function renderKaraoke() {
  const k = $('karaoke');
  const synced = lines.filter(l => l.time != null);
  if (!synced.length) { k.innerHTML = '<small>Load a song and synced lyrics first.</small>'; return; }
  k.innerHTML = '';
  synced.forEach((l, i) => {
    const d = document.createElement('div');
    d.className = 'k';
    d.textContent = l.text;
    d.addEventListener('click', () => { audio.currentTime = l.time; });
    k.appendChild(d);
  });
  activeIdx = -1;
  updateKaraoke();
}
function updateKaraoke() {
  const synced = lines.filter(l => l.time != null);
  if (!synced.length) return;
  const t = audio.currentTime;
  let cur = -1;
  for (let i = 0; i < synced.length; i++) { if (synced[i].time <= t) cur = i; else break; }
  if (cur === activeIdx) return;
  activeIdx = cur;
  [...$('karaoke').children].forEach((el, i) => {
    el.classList.toggle('active', i === cur);
    el.classList.toggle('past', i < cur);
  });
  const el = $('karaoke').children[cur];
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
audio.addEventListener('timeupdate', updateKaraoke);
audio.addEventListener('seeked', updateKaraoke);
// timeupdate only fires ~4x/sec; poll for tighter sync while playing
setInterval(() => { if (!audio.paused) updateKaraoke(); }, 50);

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
  const sync = b.dataset.tab === 'sync';
  $('sync').classList.toggle('hidden', !sync);
  $('play-view').classList.toggle('hidden', sync);
  if (!sync) renderKaraoke();
}));
</script>
</body>
</html>
